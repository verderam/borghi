{{ $p := .Page }}
<article class="category-card">
  <a class="category-media" href="{{ $p.RelPermalink }}"><img src="{{ $p.Params.cover | relURL }}" alt="Copertina del percorso {{ $p.Title }}" width="1200" height="800" loading="lazy" decoding="async"></a>
  <div class="category-body">
    <p class="idea-meta">{{ .Count }} idee</p>
    <h3><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h3>
    <p>{{ $p.Description }}</p>
    <a class="text-link" href="{{ $p.RelPermalink }}">Esplora il percorso <span aria-hidden="true">→</span></a>
  </div>
</article>
