{{ $cat := index .Params.categorie 0 }}
<article class="idea-card" data-number="{{ .Params.number }}" data-title="{{ lower .Title }}" data-category="{{ $cat }}" data-investment="{{ lower .Params.identikit.investimento }}" data-impegno="{{ lower .Params.identikit.impegno }}" data-search="{{ lower (printf "%s %s %s %s" .Title .Params.source_code $cat .Params.summary) }}">
  <a class="card-media" href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true">
    <img src="{{ .Params.cover | relURL }}" alt="" width="1200" height="800" loading="lazy" decoding="async">
  </a>
  <div class="card-body">
    <p class="idea-meta"><span class="idea-code">{{ .Params.source_code }}</span><span>{{ humanize $cat }}</span></p>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="card-summary">{{ .Params.summary }}</p>
    <a class="card-action" href="{{ .RelPermalink }}" aria-label="Apri la scheda: {{ .Title }}">Apri la scheda <span class="arrow" aria-hidden="true">↗</span></a>
  </div>
</article>
